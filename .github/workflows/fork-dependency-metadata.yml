name: Resolve fork Android dependency checksums

on:
  workflow_dispatch:
  push:
    branches: [integration/fork-dev]
    paths: [.github/workflows/fork-dependency-metadata.yml]

permissions:
  contents: read

jobs:
  checksums:
    if: github.repository == 'TeenKode/tilecast'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      # This maintenance job produces metadata for review. Shipping and PR
      # builds continue to use strict, committed dependency verification.
      - name: Resolve the new Media3 graph from Google and Maven Central
        working-directory: apps/player-android
        run: ./gradlew :app:testDebugUnitTest --write-verification-metadata sha256 -x :app:verifySharedRuntime -x :app:buildNativeCore --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fork-android-verification-metadata
          path: apps/player-android/gradle/verification-metadata.xml
          if-no-files-found: error
