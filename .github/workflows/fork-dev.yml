name: Temporary Android Website diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build signed isolated instrumentation
        env:
          KEYSTORE: ${{ secrets.TILECAST_TEST_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/probe"
          mkdir -p "$work/classes" "$work/dex"
          printf '%s' "$KEYSTORE" | base64 -d > "$work/key.jks"
          chmod 600 "$work/key.jks"
          trap 'rm -f "$work/key.jks"' EXIT
          tools="$ANDROID_HOME/build-tools/35.0.0"
          framework="$ANDROID_HOME/platforms/android-35/android.jar"
          javac -source 8 -target 8 -classpath "$framework" -d "$work/classes" scripts/android-website-probe/Probe.java
          "$tools/d8" --lib "$framework" --output "$work/dex" "$work/classes/org/tilecast/probe/Probe.class"
          "$tools/aapt" package -f -M scripts/android-website-probe/AndroidManifest.xml -I "$framework" -F "$work/probe-unsigned.apk"
          (cd "$work/dex" && zip "$work/probe-unsigned.apk" classes.dex)
          "$tools/zipalign" -f 4 "$work/probe-unsigned.apk" "$work/probe-aligned.apk"
          "$tools/apksigner" sign --ks "$work/key.jks" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$work/probe.apk" "$work/probe-aligned.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: temporary-website-probe
          path: ${{ runner.temp }}/probe/probe.apk
          retention-days: 1
