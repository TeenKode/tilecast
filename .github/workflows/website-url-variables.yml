name: Website URL variable checks

on:
  pull_request:
    paths:
      - "packages/player-runtime/src/remote-web/**"
      - "packages/player-runtime/src/compat/**"
      - "apps/server/internal/media/**"
      - "apps/server/internal/contentdefs/**"
      - "apps/player-android/app/src/**"
      - ".github/workflows/website-url-variables.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: Website URL resolver (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec --workspace @tilecast/player-runtime -- vitest run src/remote-web/url-template.test.ts
      - run: npm run typecheck --workspace @tilecast/player-runtime

  server:
    name: Website normalization and dependency tests (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Focused server tests
        working-directory: apps/server
        run: go test ./internal/media ./internal/contentdefs -run '^(TestWebsite|TestWidgetDataSourceIDs)' -count=1

  android:
    name: Website URL Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub Ubuntu runners already provide the Android SDK and command-line tools.
      # setup-android@v3 requests the removed legacy `tools` package.
      - name: Compile Android and test URL variables
        working-directory: apps/player-android
        run: ./gradlew :app:testDebugUnitTest --tests org.tilecast.player.runtime.WebsiteUrlVariablesTest --no-daemon
