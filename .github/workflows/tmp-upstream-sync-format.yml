name: Temporary upstream sync Prettier autofix

on:
  push:
    branches:
      - sync/upstream-main-20261114

permissions:
  contents: write

jobs:
  format-sync:
    if: github.event.head_commit.message != 'chore(ci): remove temporary formatter'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Format exactly the files flagged by required CI
        run: |
          npx --yes prettier@3.9.9 --write \
            apps/dashboard/src/components/LiveStreamDialog.test.tsx \
            apps/dashboard/src/components/LiveStreamDialog.tsx \
            apps/dashboard/src/live-stream/LiveStreamSurface.tsx \
            apps/player-linux/src/core/download.test.ts \
            apps/player-linux/src/core/download.ts \
            apps/player-linux/src/core/live-stream.test.ts \
            apps/player-linux/src/core/system-probe.test.ts
      - name: Commit formatting only
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/dashboard/src/components/LiveStreamDialog.test.tsx \
            apps/dashboard/src/components/LiveStreamDialog.tsx \
            apps/dashboard/src/live-stream/LiveStreamSurface.tsx \
            apps/player-linux/src/core/download.test.ts \
            apps/player-linux/src/core/download.ts \
            apps/player-linux/src/core/live-stream.test.ts \
            apps/player-linux/src/core/system-probe.test.ts
          git commit -m "style: apply Prettier to upstream sync integration"
          git push origin HEAD:sync/upstream-main-20261114
