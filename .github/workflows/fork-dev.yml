name: Android production Rust verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: player-android-rust-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: bash scripts/ci/cargo-player-android.sh fmt --check
      - run: bash scripts/ci/cargo-player-android.sh clippy --all-targets -- -D warnings
      - run: bash scripts/ci/cargo-player-android.sh test
      - run: bash scripts/ci/cargo-player-android.sh doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
