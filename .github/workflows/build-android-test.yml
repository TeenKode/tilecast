name: Build Android Player (side-by-side test)

on:
  push:
    branches:
      - test/android-player-main
    paths:
      - .github/workflows/build-android-test.yml
      - apps/player-android/**
      - packages/player-runtime/**
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4

      # The signing key is stored only in the repository's Actions Secret.
      # Never put a debug keystore in git: a leaked key could sign updates
      # impersonating the test Player on enrolled devices.
      - name: Restore permanent test APK signing key
        env:
          TILECAST_TEST_KEYSTORE_B64: ${{ secrets.TILECAST_TEST_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TILECAST_TEST_KEYSTORE_B64:-}" ]]; then
            echo "::error::Add repository Actions secret TILECAST_TEST_KEYSTORE_B64 before building test APKs."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$TILECAST_TEST_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          fingerprint=$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android \
            | awk '/SHA256:/{print $2; exit}')
          expected='91:54:9D:13:CD:B0:66:04:CD:CB:8A:DF:A6:FC:9E:78:73:66:BD:19:9E:3C:90:47:AB:FA:11:4A:03:E0:C1:7F'
          if [[ "$fingerprint" != "$expected" ]]; then
            echo "::error::Test APK signing key fingerprint mismatch: refusing to change signing identity."
            exit 1
          fi
          echo "TILECAST_TEST_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "Pinned Tilecast test APK signing certificate verified."

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies and build shared runtime
        run: |
          npm ci
          npm run build --workspace @tilecast/player-runtime

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Android Rust targets for pinned project toolchain
        run: |
          rustup show active-toolchain
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          rustup target list --installed
          cd apps/player-android
          rustup show active-toolchain
          rustup target list --installed
          rustc --version

      - name: Install cargo-ndk
        run: |
          cargo ndk --version 2>/dev/null | grep -qx 'cargo-ndk 4.1.2' || cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install pinned Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;29.0.14206865"

      - name: Change debug package ID for safe parallel installation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("apps/player-android/app/build.gradle.kts")
          source = gradle.read_text()
          before = '    buildTypes {\n        release {'
          after = ('    buildTypes {\n'
                   '        getByName("debug") {\n'
                   '            applicationIdSuffix = ".test"\n'
                   '            versionNameSuffix = "-test"\n'
                   '            signingConfig = signingConfigs.getByName("debug").apply {\n'
                   '                storeFile = file(System.getenv("TILECAST_TEST_KEYSTORE_PATH"))\n'
                   '                storePassword = "android"\n'
                   '                keyAlias = "androiddebugkey"\n'
                   '                keyPassword = "android"\n'
                   '            }\n'
                   '        }\n'
                   '        release {')
          assert source.count(before) == 1, "Unrecognized build.gradle.kts structure"
          gradle.write_text(source.replace(before, after))
          manifest = Path("apps/player-android/app/src/main/AndroidManifest.xml")
          data = manifest.read_text()
          before_label = 'android:label="Tilecast Player"'
          assert data.count(before_label) == 1, "Unexpected AndroidManifest.xml"
          manifest.write_text(data.replace(before_label, 'android:label="Tilecast Test"'))
          PY

      - name: Assemble test APK
        working-directory: apps/player-android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Verify packaged APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --print-certs apps/player-android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-signature.txt"
          expected='91549d13cdb06604cdcba8dfa6fc9e787366bd199e3c9047abfa114a03e0c17f'
          grep -E 'Signer #1 certificate SHA-256 digest:' "$RUNNER_TEMP/apk-signature.txt" || true
          grep -Fqi "Signer #1 certificate SHA-256 digest: $expected" "$RUNNER_TEMP/apk-signature.txt" || {
            echo "::error::APK is not signed with the pinned Tilecast test certificate."
            exit 1
          }
          echo "APK signature matches pinned test certificate."

      - name: Test remote host lifecycle
        working-directory: apps/player-android
        run: ./gradlew :app:testDebugUnitTest --tests 'org.tilecast.player.runtime.RuntimeHostSessionTest' --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilecast-android-main-side-by-side-test
          path: apps/player-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
