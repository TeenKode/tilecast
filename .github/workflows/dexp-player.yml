name: DEXP Android Player

on:
  push:
    branches: [dexp-optional-accessibility]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dexp-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.TILECAST_DEXP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/dexp-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dexp-signing/player.jks"
          chmod 600 "$RUNNER_TEMP/dexp-signing/player.jks"
      - name: Test, lint, and build signed APK
        working-directory: apps/player-android
        env:
          TILECAST_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dexp-signing/player.jks
          TILECAST_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TILECAST_DEXP_KEYSTORE_PASSWORD }}
          TILECAST_ANDROID_KEY_ALIAS: tilecast-dexp
          TILECAST_ANDROID_KEY_PASSWORD: ${{ secrets.TILECAST_DEXP_KEYSTORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --no-daemon --console=plain
      - name: Upload signed Player
        uses: actions/upload-artifact@v4
        with:
          name: tilecast-player-dexp
          path: apps/player-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-check-results
          path: |
            apps/player-android/app/build/test-results/
            apps/player-android/app/build/reports/
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/dexp-signing/player.jks"
